[config.wallpaper]
command = "wpaperctl"
arguments = ["set"]
set = false

[templates.waybar]
input_path = './templates/waybar-colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.hyprland-lua]
input_path = './templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.hyprland-conf]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'

[templates.rofi]
input_path = './templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors/matugen.rasi'

[templates.hyprquickpaper]
input_path = './templates/hyprquickpaper-colors.json'
output_path = '~/.config/quickshell/hyprquickpaper/colors.json'

[templates.mako]
input_path = './templates/mako'
output_path = '~/.config/mako/mako-colors'
post_hook = 'makoctl reload'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.qt5ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.telegram]
input_path = './templates/telegram.tdesktop-theme'
output_path = '~/.cache/matugen/telegram.tdesktop-theme'

[templates.spicetify]
input_path = './templates/spicetify.ini'
output_path = '~/.config/spicetify/Themes/Sleek/color.ini'
post_hook = 'pgrep -x spicetify > /dev/null || spicetify apply -n'

[templates.obsidian]
input_path = './templates/obsidian.css'
output_path = '~/Documents/Obsidian Vault/.obsidian/snippets/matugen.css'

[templates.obs]
input_path = './templates/obs.obt'
output_path = '~/.config/obs-studio/themes/matugen.obt'

[templates.vesktop]
input_path = './templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/midnight-discord.css'

[templates.heroic]
input_path = './templates/heroic.css'
output_path = '~/.config/heroic/themes/matugen.css'

[templates.elyprismlauncher]
input_path = './templates/elyprismlauncher.json'
output_path = '~/.local/share/ElyPrismLauncher/themes/Matugen/theme.json'

[templates.wine]
input_path = './templates/wine.reg'
output_path = '/tmp/wine.reg'
post_hook = 'wine regedit /tmp/wine.reg'

[templates.yazi]
input_path = './templates/yazi.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.cava]
input_path = './templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen'
post_hook = 'pkill -USR1 cava'
